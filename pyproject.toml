[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markgocomm-chunking_recall_impact_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出对齐算法研究员·分块策略对召回的影响上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "markgocomm" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://markgocomm.github.io"
Repository = "https://github.com/markgocomm/chunking_recall_impact_grouping"
Issues = "https://github.com/markgocomm/chunking_recall_impact_grouping/issues"

[project.scripts]
chunking_recall_impact_grouping = "chunking_recall_impact_grouping:main"

[tool.setuptools]
py-modules = ["chunking_recall_impact_grouping"]
